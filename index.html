<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cel's Interactive Reviewer & Guide</title>
  
  <!-- Load Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Load Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg: #FAF7F2;
      --card-bg: #FFFFFF;
      --card-border: #EFECE6;
      --text-main: #2D2A26;
      --text-muted: #736E65;
      --primary: #D97757;
      --primary-hover: #C56343;
      --secondary-btn: #EFECE6;
      --secondary-text: #4A4640;
      --option-bg: #FCFBFA;
      --option-border: #E8E4DD;
      
      --correct-bg: #EAEFD9;
      --correct-border: #A1B872;
      --correct-text: #32471B;
      
      --incorrect-bg: #F9EAE1;
      --incorrect-border: #E4A18B;
      --incorrect-text: #632214;
      
      --hint-bg: #FAF1DD;
      --hint-text: #705118;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      max-width: 750px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      margin-bottom: 1.75rem;
      text-align: center;
    }

    h2, h3 {
      font-weight: 600;
      color: var(--text-main);
      margin-top: 0;
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
    }

    .box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
    }

    label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      display: block;
      margin-bottom: 6px;
    }

    input[type="text"], textarea, select {
      width: 100%;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: #FAF9F6;
      border: 1px solid var(--option-border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      transition: all 0.2s ease;
    }

    textarea {
      height: 130px;
      resize: vertical;
    }

    input[type="text"]:focus, textarea:focus, select:focus {
      outline: none;
      background-color: #FFFFFF;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(217, 119, 87, 0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      background-color: var(--primary);
      color: #FFFFFF;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      width: auto;
      background-color: var(--secondary-btn);
      color: var(--secondary-text);
      margin-right: 10px;
    }

    .btn-secondary:hover {
      background-color: #E2DFD7;
    }

    .option {
      display: block;
      width: 100%;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-main);
      padding: 14px 18px;
      margin: 10px 0;
      text-align: left;
      border: 1px solid var(--option-border);
      border-radius: 12px;
      background: var(--option-bg);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option:hover {
      border-color: var(--primary);
      background: #FFFFFF;
      transform: translateY(-1px);
    }

    .correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text) !important;
      font-weight: 600;
    }

    .incorrect {
      background-color: var(--incorrect-bg) !important;
      border-color: var(--incorrect-border) !important;
      color: var(--incorrect-text) !important;
    }

    .hint {
      color: var(--hint-text);
      background-color: var(--hint-bg);
      padding: 14px 16px;
      border-radius: 10px;
      margin-top: 14px;
      font-size: 0.9rem;
    }

    .feedback {
      padding: 14px 16px;
      border-radius: 10px;
      margin-top: 14px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .lesson-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--card-border);
    }

    .lesson-item:last-child {
      border-bottom: none;
    }

    .lesson-title {
      font-weight: 600;
      color: var(--text-main);
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <h1>Cel's Interactive Reviewer & Guide</h1>

  <div id="setup">
    <div class="box">
      <h3>Add New Lesson / Transes</h3>
      
      <label for="lessonTitle">Lesson Title</label>
      <input type="text" id="lessonTitle" placeholder="e.g., Biology - Chapter 1 Cell Structure">
      
      <label for="transcript">Transes / Notes Text</label>
      <textarea id="transcript" placeholder="Paste your transcripts or notes here..."></textarea>
      
      <label for="numQuestions">Number of Questions</label>
      <select id="numQuestions">
        <option value="10">10 Questions</option>
        <option value="20">20 Questions</option>
        <option value="50">50 Questions</option>
        <option value="100">100 Questions</option>
      </select>
      
      <button class="btn" id="generateBtn" onclick="generateAndSave()">Generate Interactive Quiz</button>
    </div>

    <div class="box">
      <h3>Your Saved Lessons</h3>
      <div id="lessonList">Loading saved lessons...</div>
    </div>
  </div>

  <div id="quiz" class="hidden">
    <div class="box">
      <button class="btn btn-secondary" onclick="exitQuiz()">← Back to Lessons</button>
      <h2 id="qTitle" style="margin-top: 16px;"></h2>
      <p id="qText" style="font-size: 1.05rem; font-weight: 600; color: var(--text-main); margin-top: 16px;"></p>
      
      <div id="options"></div>
      
      <div id="hint" class="hint hidden"></div>
      <div id="feedback" class="feedback hidden"></div>
      
      <div style="margin-top: 20px; display: flex; gap: 10px;">
        <button class="btn btn-secondary" onclick="toggleHint()">Toggle Hint</button>
        <button id="nextBtn" class="btn hidden" onclick="nextQuestion()">Next Question →</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ahswtcanvsljnprksgem.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable__JiMbUYibb3YkSZlyaZVHg_5EaXv-BA";
    
    let supabase = null;
    let currentLesson = null;
    let currentQuestions = [];
    let currentIndex = 0;

    window.addEventListener('DOMContentLoaded', () => {
      if (window.supabase) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        loadLessons();
      } else {
        console.error("Supabase SDK failed to load.");
      }
    });

    async function loadLessons() {
      if (!supabase) return;
      const { data, error } = await supabase.from('lessons').select('id, title, created_at').order('created_at', { ascending: false });
      const container = document.getElementById('lessonList');
      
      if (error || !data || data.length === 0) {
        container.innerHTML = "<p style='color: var(--text-muted); font-size: 0.9rem;'>No saved lessons found.</p>";
        return;
      }
      
      container.innerHTML = data.map(l => `
        <div class="lesson-item">
          <span class="lesson-title">${l.title}</span>
          <button class="btn btn-secondary" style="width: auto; padding: 8px 14px; font-size: 0.85rem;" onclick="startQuiz('${l.id}')">Start / Resume</button>
        </div>
      `).join('');
    }

    async function generateAndSave() {
      const title = document.getElementById('lessonTitle').value;
      const transcript = document.getElementById('transcript').value;
      const numQuestions = document.getElementById('numQuestions').value;

      if (!title || !transcript) return alert("Please fill in both the title and text transcript.");

      const genBtn = document.getElementById('generateBtn');
      genBtn.disabled = true;
      genBtn.innerText = "Generating Quiz... Please wait";

      try {
        const { data, error } = await supabase.functions.invoke('generate-quiz', {
          body: { transcript, numQuestions }
        });

        if (error || !data || !data.quiz) {
          console.error(error);
          alert("Failed to generate quiz. Check that your GEMINI_API_KEY secret is set in Supabase.");
          genBtn.disabled = false;
          genBtn.innerText = "Generate Interactive Quiz";
          return;
        }

        const { data: lessonData, error: dbError } = await supabase.from('lessons').insert([
          { title, questions: data.quiz }
        ]).select().single();

        if (dbError) {
          alert("Error saving lesson to database: " + dbError.message);
          genBtn.disabled = false;
          genBtn.innerText = "Generate Interactive Quiz";
          return;
        }

        await supabase.from('progress').insert([{ lesson_id: lessonData.id, current_question_index: 0 }]);

        document.getElementById('lessonTitle').value = "";
        document.getElementById('transcript').value = "";
        genBtn.disabled = false;
        genBtn.innerText = "Generate Interactive Quiz";
        loadLessons();
        startQuiz(lessonData.id);

      } catch (err) {
        console.error(err);
        alert("An error occurred: " + err.message);
        genBtn.disabled = false;
        genBtn.innerText = "Generate Interactive Quiz";
      }
    }

    async function startQuiz(lessonId) {
      const { data: lesson } = await supabase.from('lessons').select('*').eq('id', lessonId).single();
      const { data: prog } = await supabase.from('progress').select('*').eq('lesson_id', lessonId).single();

      currentLesson = lesson;
      currentQuestions = lesson.questions;
      currentIndex = prog ? prog.current_question_index : 0;

      document.getElementById('setup').classList.add('hidden');
      document.getElementById('quiz').classList.remove('hidden');
      renderQuestion();
    }

    function renderQuestion() {
      if (currentIndex >= currentQuestions.length) {
        document.getElementById('qTitle').innerText = currentLesson.title;
        document.getElementById('qText').innerText = "🎉 Quiz Completed! You've reviewed all material for this lesson.";
        document.getElementById('options').innerHTML = "";
        document.getElementById('nextBtn').classList.add('hidden');
        return;
      }

      const q = currentQuestions[currentIndex];
      document.getElementById('qTitle').innerText = `${currentLesson.title} (${currentIndex + 1}/${currentQuestions.length})`;
      document.getElementById('qText').innerText = q.question;
      
      const hintBox = document.getElementById('hint');
      hintBox.innerText = "💡 Hint: " + q.hint;
      hintBox.classList.add('hidden');
      
      document.getElementById('feedback').classList.add('hidden');
      document.getElementById('nextBtn').classList.add('hidden');

      const optsDiv = document.getElementById('options');
      optsDiv.innerHTML = q.options.map((opt, i) => `
        <button class="option" onclick="checkAnswer(${i})">${opt}</button>
      `).join('');
    }

    async function checkAnswer(selectedIdx) {
      const q = currentQuestions[currentIndex];
      const btns = document.querySelectorAll('.option');
      
      btns.forEach((btn, i) => {
        btn.disabled = true;
        if (i === q.answer) btn.classList.add('correct');
        if (i === selectedIdx && i !== q.answer) btn.classList.add('incorrect');
      });

      const fb = document.getElementById('feedback');
      fb.classList.remove('hidden');
      
      if (selectedIdx === q.answer) {
        fb.innerText = "✅ Correct! " + q.explanation;
        fb.style.backgroundColor = "var(--correct-bg)";
        fb.style.color = "var(--correct-text)";
      } else {
        fb.innerText = "❌ Incorrect. " + q.explanation;
        fb.style.backgroundColor = "var(--incorrect-bg)";
        fb.style.color = "var(--incorrect-text)";
      }

      document.getElementById('nextBtn').classList.remove('hidden');

      await supabase.from('progress').upsert({
        lesson_id: currentLesson.id,
        current_question_index: currentIndex + 1
      });
    }

    function nextQuestion() {
      currentIndex++;
      renderQuestion();
    }

    function toggleHint() {
      document.getElementById('hint').classList.toggle('hidden');
    }

    function exitQuiz() {
      document.getElementById('quiz').classList.add('hidden');
      document.getElementById('setup').classList.remove('hidden');
      loadLessons();
    }
  </script>
</body>
</html>
