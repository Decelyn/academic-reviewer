<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome back, Bazty James!</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Supabase SDK -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- PDF.js for reading PDF files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Mammoth.js for reading Word (.docx) files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  
  <style>
    :root {
      --bg: #FAF7F2;
      --card-bg: #FFFFFF;
      --card-border: #EFECE6;
      --text-main: #2D2A26;
      --text-muted: #736E65;
      --primary: #D97757;
      --primary-hover: #C56343;
      --secondary-btn: #EFECE6;
      --secondary-text: #4A4640;
      --danger-btn: #FCE8E6;
      --danger-text: #C5221F;
      --option-bg: #FCFBFA;
      --option-border: #E8E4DD;
      --correct-bg: #EAEFD9;
      --correct-border: #A1B872;
      --correct-text: #32471B;
      --incorrect-bg: #F9EAE1;
      --incorrect-border: #E4A18B;
      --incorrect-text: #632214;
      --hint-bg: #FAF1DD;
      --hint-text: #705118;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      max-width: 750px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem;
      line-height: 1.6;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      margin-bottom: 1.75rem;
      text-align: center;
    }

    h2, h3 {
      font-weight: 600;
      color: var(--text-main);
      margin-top: 0;
      margin-bottom: 0.75rem;
    }

    .box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
    }

    label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      display: block;
      margin-bottom: 6px;
    }

    input[type="text"], textarea, select, input[type="file"] {
      width: 100%;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: #FAF9F6;
      border: 1px solid var(--option-border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }

    textarea {
      height: 130px;
      resize: vertical;
    }

    .file-dropzone {
      border: 2px dashed var(--option-border);
      background-color: #FAF9F6;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
      transition: background-color 0.2s ease;
      cursor: pointer;
    }

    .file-dropzone:hover {
      background-color: #F4F1EA;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      background-color: var(--primary);
      color: #FFFFFF;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn:hover { background-color: var(--primary-hover); }

    .btn-secondary {
      width: auto;
      background-color: var(--secondary-btn);
      color: var(--secondary-text);
    }

    .btn-secondary:hover { background-color: #E2DFD7; }

    .btn-danger {
      width: auto;
      background-color: var(--danger-btn);
      color: var(--danger-text);
      padding: 8px 12px;
      font-size: 0.85rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-danger:hover { background-color: #F8D7D4; }

    .option {
      display: block;
      width: 100%;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-main);
      padding: 14px 18px;
      margin: 10px 0;
      text-align: left;
      border: 1px solid var(--option-border);
      border-radius: 12px;
      background: var(--option-bg);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option:hover { border-color: var(--primary); background: #FFFFFF; }

    .correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text) !important;
      font-weight: 600;
    }

    .incorrect {
      background-color: var(--incorrect-bg) !important;
      border-color: var(--incorrect-border) !important;
      color: var(--incorrect-text) !important;
    }

    .hint {
      color: var(--hint-text);
      background-color: var(--hint-bg);
      padding: 14px 16px;
      border-radius: 10px;
      margin-top: 14px;
      font-size: 0.9rem;
    }

    .feedback {
      padding: 14px 16px;
      border-radius: 10px;
      margin-top: 14px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .lesson-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--card-border);
    }

    .lesson-item:last-child { border-bottom: none; }
    .lesson-actions { display: flex; gap: 8px; align-items: center; }
    .lesson-title { font-weight: 600; color: var(--text-main); }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h1>Welcome back, Bazty James!</h1>

  <div id="setup">
    <div class="box">
      <h3>Add New Lesson / Transes</h3>
      
      <label for="lessonTitle">Lesson Title</label>
      <input type="text" id="lessonTitle" placeholder="e.g., Parasitology - Amoebiasis & Giardiasis">
      
      <!-- Upload File Input -->
      <div class="file-dropzone">
        <label for="fileInput" style="cursor: pointer; color: var(--primary); margin-bottom: 4px; display: block;">
          📁 Upload Notes File (.pdf, .docx, .txt)
        </label>
        <span id="fileStatus" style="font-size: 0.85rem; color: var(--text-muted); display: block;">Or paste your text below directly</span>
        <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md" style="display: none;">
      </div>

      <label for="transcript">Transes / Notes Text</label>
      <textarea id="transcript" placeholder="Paste or extracted file text will appear here..."></textarea>
      
      <label for="numQuestions">Number of Questions</label>
      <select id="numQuestions">
        <option value="10">10 Questions</option>
        <option value="20">20 Questions</option>
        <option value="50">50 Questions</option>
      </select>
      
      <button class="btn" id="generateBtn" type="button">Generate Interactive Quiz</button>
    </div>

    <div class="box">
      <h3>Your Saved Lessons</h3>
      <div id="lessonList">Loading saved lessons...</div>
    </div>
  </div>

  <div id="quiz" class="hidden">
    <div class="box">
      <button class="btn btn-secondary" id="backBtn">← Back to Lessons</button>
      <h2 id="qTitle" style="margin-top: 16px;"></h2>
      <p id="qText" style="font-size: 1.05rem; font-weight: 600; color: var(--text-main); margin-top: 16px;"></p>
      
      <div id="options"></div>
      
      <div id="hint" class="hint hidden"></div>
      <div id="feedback" class="feedback hidden"></div>
      
      <div style="margin-top: 20px; display: flex; gap: 10px;">
        <button class="btn btn-secondary" id="hintBtn">Toggle Hint</button>
        <button id="nextBtn" class="btn hidden">Next Question →</button>
      </div>
    </div>
  </div>

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    var SUPABASE_URL = "https://ahswtcanvsljnprksgem.supabase.co";
    var SUPABASE_ANON_KEY = "sb_publishable__JiMbUYibb3YkSZlyaZVHg_5EaXv-BA";
    
    var dbClient = null;
    var currentLesson = null;
    var currentQuestions = [];
    var currentIndex = 0;

    function getSupabaseClient() {
      if (!dbClient && window.supabase && typeof window.supabase.createClient === 'function') {
        dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
      return dbClient;
    }

    document.addEventListener("DOMContentLoaded", function() {
      var client = getSupabaseClient();
      if (client) {
        loadLessons();
      } else {
        setTimeout(function() { if (getSupabaseClient()) loadLessons(); }, 1000);
      }

      document.getElementById("generateBtn").addEventListener("click", handleGenerateClick);
      document.getElementById("backBtn").addEventListener("click", exitQuiz);
      document.getElementById("hintBtn").addEventListener("click", toggleHint);
      document.getElementById("nextBtn").addEventListener("click", nextQuestion);
      
      var fileDropzone = document.querySelector(".file-dropzone");
      var fileInput = document.getElementById("fileInput");
      
      fileDropzone.addEventListener("click", function() { fileInput.click(); });
      fileInput.addEventListener("change", handleFileUpload);
    });

    async function handleFileUpload(event) {
      var file = event.target.files[0];
      if (!file) return;

      var fileStatus = document.getElementById("fileStatus");
      var transcriptBox = document.getElementById("transcript");
      var titleInput = document.getElementById("lessonTitle");

      fileStatus.innerText = "Reading " + file.name + "...";

      if (!titleInput.value) {
        titleInput.value = file.name.replace(/\.[^/.]+$/, "");
      }

      try {
        if (file.name.endsWith('.txt') || file.name.endsWith('.md')) {
          var text = await file.text();
          transcriptBox.value = text;
          fileStatus.innerText = "Loaded: " + file.name;
        } 
        else if (file.name.endsWith('.docx')) {
          var arrayBuffer = await file.arrayBuffer();
          var result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
          transcriptBox.value = result.value;
          fileStatus.innerText = "Loaded: " + file.name;
        } 
        else if (file.name.endsWith('.pdf')) {
          var arrayBuffer = await file.arrayBuffer();
          var pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          var extractedText = "";
          
          for (var i = 1; i <= pdf.numPages; i++) {
            var page = await pdf.getPage(i);
            var content = await page.getTextContent();
            var pageText = content.items.map(function(item) { return item.str; }).join(" ");
            extractedText += pageText + "\n";
          }
          
          transcriptBox.value = extractedText;
          fileStatus.innerText = "Loaded: " + file.name;
        } else {
          alert("Unsupported file format. Please upload a .pdf, .docx, or .txt file.");
          fileStatus.innerText = "Or paste your text below directly";
        }
      } catch (err) {
        console.error("File processing error:", err);
        alert("Failed to read file: " + err.message);
        fileStatus.innerText = "Error reading file. Try pasting text manually.";
      }
    }

    function loadLessons() {
      var client = getSupabaseClient();
      if (!client) return;
      client.from('lessons').select('id, title, created_at').order('created_at', { ascending: false })
        .then(function(res) {
          var container = document.getElementById('lessonList');
          if (res.error || !res.data || res.data.length === 0) {
            container.innerHTML = "<p style='color: var(--text-muted); font-size: 0.9rem;'>No saved lessons found.</p>";
            return;
          }
          
          container.innerHTML = res.data.map(function(l) {
            return '<div class="lesson-item">' +
                     '<span class="lesson-title">' + l.title + '</span>' +
                     '<div class="lesson-actions">' +
                       '<button class="btn btn-secondary" style="padding: 8px 14px; font-size: 0.85rem;" onclick="startQuiz(\'' + l.id + '\')">Start / Resume</button>' +
                       '<button class="btn btn-danger" onclick="deleteLesson(\'' + l.id + '\', \'' + l.title.replace(/'/g, "\\'") + '\')">🗑️</button>' +
                     '</div>' +
                   '</div>';
          }).join('');
        });
    }

    function deleteLesson(lessonId, title) {
      if (!confirm("Are you sure you want to delete '" + title + "'?")) return;
      
      var client = getSupabaseClient();
      if (!client) return;

      client.from('lessons').delete().eq('id', lessonId).then(function(res) {
        if (res.error) {
          alert("Failed to delete lesson: " + res.error.message);
        } else {
          loadLessons();
        }
      });
    }

    function handleGenerateClick() {
      var title = document.getElementById('lessonTitle').value;
      var transcript = document.getElementById('transcript').value;
      var numQuestions = document.getElementById('numQuestions').value;

      if (!title || !transcript) {
        alert("Please enter a Lesson Title and provide Notes/Transes (or upload a file).");
        return;
      }

      var client = getSupabaseClient();
      if (!client) {
        alert("Database SDK failed to connect. Please refresh.");
        return;
      }

      var genBtn = document.getElementById('generateBtn');
      genBtn.disabled = true;
      genBtn.innerText = "Generating Quiz... (Please wait 15-30s)";

      client.functions.invoke('generate-quiz', {
        body: { transcript: transcript, numQuestions: numQuestions }
      }).then(function(res) {
        if (res.error || !res.data || !res.data.quiz) {
          console.error("Quiz Error:", res.error);
          alert("Failed to generate quiz. Please check your Edge Function or API key.");
          genBtn.disabled = false;
          genBtn.innerText = "Generate Interactive Quiz";
          return;
        }

        client.from('lessons').insert([
          { title: title, questions: res.data.quiz }
        ]).select().single().then(function(dbRes) {
          if (dbRes.error) {
            alert("Error saving to database: " + dbRes.error.message);
            genBtn.disabled = false;
            genBtn.innerText = "Generate Interactive Quiz";
            return;
          }

          client.from('progress').insert([{ lesson_id: dbRes.data.id, current_question_index: 0 }])
            .then(function() {
              document.getElementById('lessonTitle').value = "";
              document.getElementById('transcript').value = "";
              document.getElementById('fileStatus').innerText = "Or paste your text below directly";
              genBtn.disabled = false;
              genBtn.innerText = "Generate Interactive Quiz";
              loadLessons();
              startQuiz(dbRes.data.id);
            });
        });
      }).catch(function(err) {
        console.error(err);
        alert("System Error: " + err.message);
        genBtn.disabled = false;
        genBtn.innerText = "Generate Interactive Quiz";
      });
    }

    function startQuiz(lessonId) {
      var client = getSupabaseClient();
      if (!client) return;
      client.from('lessons').select('*').eq('id', lessonId).single().then(function(lessonRes) {
        client.from('progress').select('*').eq('lesson_id', lessonId).single().then(function(progRes) {
          currentLesson = lessonRes.data;
          currentQuestions = currentLesson.questions;
          currentIndex = progRes.data ? progRes.data.current_question_index : 0;

          document.getElementById('setup').classList.add('hidden');
          document.getElementById('quiz').classList.remove('hidden');
          renderQuestion();
        });
      });
    }

    function renderQuestion() {
      if (currentIndex >= currentQuestions.length) {
        document.getElementById('qTitle').innerText = currentLesson.title;
        document.getElementById('qText').innerText = "🎉 Quiz Completed! You've reviewed all material for this lesson.";
        document.getElementById('options').innerHTML = "";
        document.getElementById('nextBtn').classList.add('hidden');
        return;
      }

      var q = currentQuestions[currentIndex];
      document.getElementById('qTitle').innerText = currentLesson.title + " (" + (currentIndex + 1) + "/" + currentQuestions.length + ")";
      document.getElementById('qText').innerText = q.question;
      
      var hintBox = document.getElementById('hint');
      hintBox.innerText = "💡 Hint: " + q.hint;
      hintBox.classList.add('hidden');
      
      document.getElementById('feedback').classList.add('hidden');
      document.getElementById('nextBtn').classList.add('hidden');

      var optsDiv = document.getElementById('options');
      optsDiv.innerHTML = q.options.map(function(opt, i) {
        return '<button class="option" onclick="checkAnswer(' + i + ')">' + opt + '</button>';
      }).join('');
    }

    function checkAnswer(selectedIdx) {
      var q = currentQuestions[currentIndex];
      var btns = document.querySelectorAll('.option');
      
      btns.forEach(function(btn, i) {
        btn.disabled = true;
        if (i === q.answer) btn.classList.add('correct');
        if (i === selectedIdx && i !== q.answer) btn.classList.add('incorrect');
      });

      var fb = document.getElementById('feedback');
      fb.classList.remove('hidden');
      
      if (selectedIdx === q.answer) {
        fb.innerText = "✅ Correct! " + q.explanation;
        fb.style.backgroundColor = "var(--correct-bg)";
        fb.style.color = "var(--correct-text)";
      } else {
        fb.innerText = "❌ Incorrect. " + q.explanation;
        fb.style.backgroundColor = "var(--incorrect-bg)";
        fb.style.color = "var(--incorrect-text)";
      }

      document.getElementById('nextBtn').classList.remove('hidden');

      var client = getSupabaseClient();
      if (client) {
        client.from('progress').upsert({
          lesson_id: currentLesson.id,
          current_question_index: currentIndex + 1
        });
      }
    }

    function nextQuestion() {
      currentIndex++;
      renderQuestion();
    }

    function toggleHint() {
      document.getElementById('hint').classList.toggle('hidden');
    }

    function exitQuiz() {
      document.getElementById('quiz').classList.add('hidden');
      document.getElementById('setup').classList.remove('hidden');
      loadLessons();
    }
  </script>
</body>
</html>
