<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome back, Bazty James!</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Supabase & Parser SDKs -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  
  <style>
    :root {
      --bg: #FAF7F2;
      --card-bg: #FFFFFF;
      --card-border: #EFECE6;
      --text-main: #2D2A26;
      --text-muted: #736E65;
      --primary: #D97757;
      --primary-hover: #C56343;
      --secondary-btn: #EFECE6;
      --secondary-text: #4A4640;
      --danger-btn: #FCE8E6;
      --danger-text: #C5221F;
      --option-bg: #FCFBFA;
      --option-border: #E8E4DD;
      --correct-bg: #EAEFD9;
      --correct-border: #A1B872;
      --correct-text: #32471B;
      --incorrect-bg: #F9EAE1;
      --incorrect-border: #E4A18B;
      --incorrect-text: #632214;
      --hint-bg: #FAF1DD;
      --hint-text: #705118;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      max-width: 780px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem;
      line-height: 1.6;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      margin-bottom: 1.75rem;
      text-align: center;
    }

    h2, h3, h4 {
      font-weight: 600;
      color: var(--text-main);
      margin-top: 0;
      margin-bottom: 0.75rem;
    }

    .box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
    }

    label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      display: block;
      margin-bottom: 6px;
    }

    input[type="text"], textarea, select, input[type="file"] {
      width: 100%;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: #FAF9F6;
      border: 1px solid var(--option-border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }

    textarea { height: 120px; resize: vertical; }

    .file-dropzone {
      border: 2px dashed var(--option-border);
      background-color: #FAF9F6;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      background-color: var(--primary);
      color: #FFFFFF;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn:hover { background-color: var(--primary-hover); }
    .btn-secondary { width: auto; background-color: var(--secondary-btn); color: var(--secondary-text); }
    .btn-secondary:hover { background-color: #E2DFD7; }
    .btn-danger { width: auto; background-color: var(--danger-btn); color: var(--danger-text); padding: 8px 12px; border: none; border-radius: 8px; cursor: pointer; }

    .option {
      display: block;
      width: 100%;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-main);
      padding: 14px 18px;
      margin: 10px 0;
      text-align: left;
      border: 1px solid var(--option-border);
      border-radius: 12px;
      background: var(--option-bg);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option:hover { border-color: var(--primary); background: #FFFFFF; }
    .correct { background-color: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: var(--correct-text) !important; font-weight: 600; }
    .incorrect { background-color: var(--incorrect-bg) !important; border-color: var(--incorrect-border) !important; color: var(--incorrect-text) !important; }

    /* Flashcard Styles */
    .flashcard-container { perspective: 1000px; margin: 20px 0; cursor: pointer; }
    .flashcard {
      width: 100%; min-height: 200px; background: #FAF9F6; border: 2px solid var(--option-border);
      border-radius: 16px; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center; font-size: 1.15rem; font-weight: 600;
      transition: transform 0.6s; transform-style: preserve-3d; position: relative;
    }
    .flashcard.flipped { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back { backface-visibility: hidden; width: 100%; }
    .flashcard-back { transform: rotateY(180deg); position: absolute; color: var(--primary); }

    /* Tags & Progress Bar */
    .tag { display: inline-block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; background: var(--secondary-btn); color: var(--secondary-text); margin-bottom: 6px; }
    .progress-bar-bg { width: 100%; height: 8px; background: var(--option-border); border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
    .timer-badge { font-weight: 700; color: var(--danger-text); background: var(--danger-btn); padding: 4px 10px; border-radius: 8px; font-size: 0.9rem; }

    .lesson-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--card-border); }
    .lesson-item:last-child { border-bottom: none; }
    .lesson-actions { display: flex; gap: 8px; align-items: center; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h1 id="mainHeader">Welcome back, Bazty James!</h1>

  <div id="setup">
    <div class="box">
      <h3>Add New Lesson / Transes</h3>
      
      <label for="lessonTitle">Lesson Title</label>
      <input type="text" id="lessonTitle" placeholder="e.g., Community Health Nursing - Epidemiology">

      <label for="categorySelect">Subject Category</label>
      <select id="categorySelect">
        <option value="Nursing Practice I">Nursing Practice I</option>
        <option value="Nursing Practice II">Nursing Practice II</option>
        <option value="Nursing Practice III">Nursing Practice III</option>
        <option value="Nursing Practice IV">Nursing Practice IV</option>
        <option value="Nursing Practice V">Nursing Practice V</option>
      </select>
      
      <div class="file-dropzone">
        <label for="fileInput" style="cursor: pointer; color: var(--primary); margin-bottom: 4px; display: block;">
          📁 Upload File or Image (.pdf, .docx, .png, .jpg, .txt)
        </label>
        <span id="fileStatus" style="font-size: 0.85rem; color: var(--text-muted); display: block;">Or paste text directly</span>
        <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md,.png,.jpg,.jpeg" style="display: none;">
      </div>

      <label for="transcript">Transes / Notes Text</label>
      <textarea id="transcript" placeholder="Extracted text from notes or images will appear here..."></textarea>
      
      <label for="numQuestions">Number of Questions</label>
      <select id="numQuestions">
        <option value="10">10 Questions</option>
        <option value="20">20 Questions</option>
        <option value="30">30 Questions</option>
        <option value="50">50 Questions</option>
        <option value="100">100 Questions</option>
      </select>
      
      <button class="btn" id="generateBtn" type="button">Generate Interactive Quiz</button>
    </div>

    <div class="box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3>Your Saved Lessons</h3>
        <select id="filterCategory" style="width: auto; margin-bottom: 0; padding: 6px 10px;">
          <option value="All">All Categories</option>
          <option value="Nursing Practice I">Nursing Practice I</option>
          <option value="Nursing Practice II">Nursing Practice II</option>
          <option value="Nursing Practice III">Nursing Practice III</option>
          <option value="Nursing Practice IV">Nursing Practice IV</option>
          <option value="Nursing Practice V">Nursing Practice V</option>
        </select>
      </div>
      <div id="lessonList">Loading saved lessons...</div>
    </div>
  </div>

  <div id="quiz" class="hidden">
    <div class="box">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <button class="btn btn-secondary" id="backBtn">← Back</button>
        <div id="timerDisplay" class="timer-badge hidden">⏱️ <span id="timeRemaining">30</span>s</div>
        <div>
          <button class="btn btn-secondary" id="modeBtn">Flip to Flashcards 🎴</button>
        </div>
      </div>

      <div style="margin-top: 14px; display: flex; gap: 12px; align-items: center;">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; margin-bottom: 0;">
          <input type="checkbox" id="timerToggle"> Enable 30s Timer per Question
        </label>
      </div>

      <h2 id="qTitle" style="margin-top: 16px;"></h2>

      <!-- Quiz View -->
      <div id="quizView">
        <p id="qText" style="font-size: 1.05rem; font-weight: 600; color: var(--text-main); margin-top: 16px;"></p>
        <div id="options"></div>
        <div id="hint" class="hint hidden"></div>
        <div id="feedback" class="feedback hidden"></div>
      </div>

      <!-- Flashcard View -->
      <div id="flashcardView" class="hidden">
        <div class="flashcard-container" id="flashcardContainer">
          <div class="flashcard" id="flashcard">
            <div class="flashcard-front" id="cardFront">Question Text</div>
            <div class="flashcard-back" id="cardBack">Answer & Explanation</div>
          </div>
        </div>
        <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem;">Click card to flip</p>
      </div>

      <!-- End of Lesson Review Sheet View -->
      <div id="summaryView" class="hidden">
        <h3 style="color: var(--primary);">🎉 Lesson Complete!</h3>
        <p id="scoreSummary" style="font-size: 1.1rem; font-weight: 600;"></p>
        
        <div style="margin: 20px 0; background: #FAF9F6; border: 1px solid var(--option-border); padding: 18px; border-radius: 12px;">
          <h4>📌 Key Concept Summary Sheet</h4>
          <ul id="summaryList" style="padding-left: 20px; color: var(--text-main);"></ul>
        </div>

        <button class="btn btn-secondary" id="reviewWeakBtn" style="margin-top: 10px; width: 100%;">⚠️ Review Missed Questions Deck</button>
      </div>

      <div style="margin-top: 20px; display: flex; gap: 10px;" id="quizControls">
        <button class="btn btn-secondary" id="hintBtn">Toggle Hint</button>
        <button id="nextBtn" class="btn hidden">Next Question →</button>
      </div>
    </div>
  </div>

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    var SUPABASE_URL = "https://ahswtcanvsljnprksgem.supabase.co";
    var SUPABASE_ANON_KEY = "sb_publishable__JiMbUYibb3YkSZlyaZVHg_5EaXv-BA";
    
    var dbClient = null, currentLesson = null, currentQuestions = [], currentIndex = 0;
    var isFlashcardMode = false, score = 0, missedIndexes = [], timerInterval = null, timeLeft = 30;

    function getSupabaseClient() {
      if (!dbClient && window.supabase && typeof window.supabase.createClient === 'function') {
        dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
      return dbClient;
    }

    document.addEventListener("DOMContentLoaded", function() {
      var client = getSupabaseClient();
      if (client) loadLessons();
      else setTimeout(function() { if (getSupabaseClient()) loadLessons(); }, 1000);

      document.getElementById("generateBtn").addEventListener("click", handleGenerateClick);
      document.getElementById("backBtn").addEventListener("click", exitQuiz);
      document.getElementById("hintBtn").addEventListener("click", function() { document.getElementById('hint').classList.toggle('hidden'); });
      document.getElementById("nextBtn").addEventListener("click", nextQuestion);
      document.getElementById("modeBtn").addEventListener("click", toggleMode);
      document.getElementById("filterCategory").addEventListener("change", loadLessons);
      document.getElementById("reviewWeakBtn").addEventListener("click", startWeakSpotReview);
      
      document.getElementById("flashcardContainer").addEventListener("click", function() {
        document.getElementById("flashcard").classList.toggle("flipped");
      });

      var fileDropzone = document.querySelector(".file-dropzone");
      var fileInput = document.getElementById("fileInput");
      fileDropzone.addEventListener("click", function() { fileInput.click(); });
      fileInput.addEventListener("change", handleFileUpload);
    });

    async function handleFileUpload(event) {
      var file = event.target.files[0];
      if (!file) return;

      var fileStatus = document.getElementById("fileStatus");
      var transcriptBox = document.getElementById("transcript");
      var titleInput = document.getElementById("lessonTitle");

      fileStatus.innerText = "Reading " + file.name + "...";
      if (!titleInput.value) titleInput.value = file.name.replace(/\.[^/.]+$/, "");

      try {
        if (file.type.startsWith('image/')) {
          var result = await Tesseract.recognize(file, 'eng');
          transcriptBox.value = result.data.text;
        } else if (file.name.endsWith('.docx')) {
          var arrayBuffer = await file.arrayBuffer();
          var result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
          transcriptBox.value = result.value;
        } else if (file.name.endsWith('.pdf')) {
          var arrayBuffer = await file.arrayBuffer();
          var pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          var extractedText = "";
          for (var i = 1; i <= pdf.numPages; i++) {
            var page = await pdf.getPage(i);
            var content = await page.getTextContent();
            extractedText += content.items.map(item => item.str).join(" ") + "\n";
          }
          transcriptBox.value = extractedText;
        } else {
          transcriptBox.value = await file.text();
        }
        fileStatus.innerText = "Loaded: " + file.name;
      } catch (err) {
        alert("File error: " + err.message);
      }
    }

    function loadLessons() {
      var client = getSupabaseClient();
      if (!client) return;
      var selectedCat = document.getElementById("filterCategory").value;

      var query = client.from('lessons').select('id, title, category, created_at').order('created_at', { ascending: false });
      if (selectedCat !== 'All') query = query.eq('category', selectedCat);

      query.then(function(res) {
        var container = document.getElementById('lessonList');
        if (!res.data || res.data.length === 0) {
          container.innerHTML = "<p style='color: var(--text-muted); font-size: 0.9rem;'>No saved lessons found.</p>";
          return;
        }

        client.from('progress').select('*').then(function(progRes) {
          var progMap = {};
          if (progRes.data) progRes.data.forEach(p => progMap[p.lesson_id] = p);

          container.innerHTML = res.data.map(function(l) {
            var prog = progMap[l.id] || { best_score: 0, current_question_index: 0, total_questions: 10 };
            var pct = prog.total_questions ? Math.round((prog.best_score / prog.total_questions) * 100) : 0;
            
            return '<div class="lesson-item">' +
                     '<div>' +
                       '<span class="tag">' + (l.category || 'Nursing Practice I') + '</span>' +
                       '<div class="lesson-title">' + l.title + '</div>' +
                       '<div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 2px;">Best Score: ' + pct + '%</div>' +
                       '<div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ' + pct + '%;"></div></div>' +
                     '</div>' +
                     '<div class="lesson-actions">' +
                       '<button class="btn btn-secondary" style="padding: 8px 14px; font-size: 0.85rem;" onclick="startQuiz(\'' + l.id + '\')">Start</button>' +
                       '<button class="btn btn-danger" onclick="deleteLesson(\'' + l.id + '\')">🗑️</button>' +
                     '</div>' +
                   '</div>';
          }).join('');
        });
      });
    }

    function handleGenerateClick() {
      var title = document.getElementById('lessonTitle').value;
      var category = document.getElementById('categorySelect').value;
      var transcript = document.getElementById('transcript').value;
      var numQuestions = document.getElementById('numQuestions').value;

      if (!title || !transcript) return alert("Please fill in Title and Text Notes.");

      var genBtn = document.getElementById('generateBtn');
      genBtn.disabled = true; genBtn.innerText = "Generating Quiz... (15-30s)";

      getSupabaseClient().functions.invoke('generate-quiz', {
        body: { transcript: transcript, numQuestions: numQuestions }
      }).then(function(res) {
        if (res.error || !res.data) {
          alert("Generation failed. Check Edge Function.");
          genBtn.disabled = false; genBtn.innerText = "Generate Interactive Quiz";
          return;
        }

        getSupabaseClient().from('lessons').insert([
          { title: title, category: category, questions: res.data.quiz, summary: res.data.summary || [] }
        ]).select().single().then(function(dbRes) {
          getSupabaseClient().from('progress').insert([{ lesson_id: dbRes.data.id, current_question_index: 0, total_questions: res.data.quiz.length }])
            .then(function() {
              genBtn.disabled = false; genBtn.innerText = "Generate Interactive Quiz";
              loadLessons();
              startQuiz(dbRes.data.id);
            });
        });
      });
    }

    function startQuiz(lessonId) {
      getSupabaseClient().from('lessons').select('*').eq('id', lessonId).single().then(function(lessonRes) {
        currentLesson = lessonRes.data;
        currentQuestions = currentLesson.questions;
        currentIndex = 0; score = 0; missedIndexes = [];

        // Update header for quiz mode
        document.getElementById('mainHeader').innerText = "Best of luck, my Future Doctor!";

        document.getElementById('setup').classList.add('hidden');
        document.getElementById('quiz').classList.remove('hidden');
        document.getElementById('summaryView').classList.add('hidden');
        document.getElementById('quizControls').classList.remove('hidden');
        
        renderQuestion();
      });
    }

    function renderQuestion() {
      stopTimer();
      document.getElementById("flashcard").classList.remove("flipped");

      if (currentIndex >= currentQuestions.length) {
        finishQuiz();
        return;
      }

      var q = currentQuestions[currentIndex];
      document.getElementById('qTitle').innerText = currentLesson.title + " (" + (currentIndex + 1) + "/" + currentQuestions.length + ")";
      
      document.getElementById('qText').innerText = q.question;
      document.getElementById('hint').innerText = "💡 Hint: " + q.hint;
      document.getElementById('hint').classList.add('hidden');
      document.getElementById('feedback').classList.add('hidden');
      document.getElementById('nextBtn').classList.add('hidden');

      var optsDiv = document.getElementById('options');
      optsDiv.innerHTML = q.options.map((opt, i) => `<button class="option" onclick="checkAnswer(${i})">${opt}</button>`).join('');

      document.getElementById('cardFront').innerText = q.question;
      document.getElementById('cardBack').innerText = "Answer: " + q.options[q.answer] + "\n\n" + q.explanation;

      if (document.getElementById("timerToggle").checked && !isFlashcardMode) {
        startTimer();
      }
    }

    function startTimer() {
      timeLeft = 30;
      document.getElementById("timerDisplay").classList.remove("hidden");
      document.getElementById("timeRemaining").innerText = timeLeft;

      timerInterval = setInterval(function() {
        timeLeft--;
        document.getElementById("timeRemaining").innerText = timeLeft;
        if (timeLeft <= 0) {
          stopTimer();
          checkAnswer(-1);
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
      document.getElementById("timerDisplay").classList.add("hidden");
    }

    function checkAnswer(selectedIdx) {
      stopTimer();
      var q = currentQuestions[currentIndex];
      var btns = document.querySelectorAll('.option');
      
      btns.forEach((btn, i) => {
        btn.disabled = true;
        if (i === q.answer) btn.classList.add('correct');
        if (i === selectedIdx && i !== q.answer) btn.classList.add('incorrect');
      });

      var fb = document.getElementById('feedback');
      fb.classList.remove('hidden');
      
      if (selectedIdx === q.answer) {
        score++;
        fb.innerText = "✅ Correct! " + q.explanation;
        fb.className = "feedback correct";
      } else {
        missedIndexes.push(currentIndex);
        fb.innerText = "❌ Incorrect. " + q.explanation;
        fb.className = "feedback incorrect";
      }

      document.getElementById('nextBtn').classList.remove('hidden');
    }

    function nextQuestion() {
      currentIndex++;
      renderQuestion();
    }

    function finishQuiz() {
      document.getElementById('quizView').classList.add('hidden');
      document.getElementById('flashcardView').classList.add('hidden');
      document.getElementById('quizControls').classList.add('hidden');
      document.getElementById('summaryView').classList.remove('hidden');

      var pct = Math.round((score / currentQuestions.length) * 100);
      document.getElementById('scoreSummary').innerText = `You scored ${score} / ${currentQuestions.length} (${pct}%)`;

      var sumList = document.getElementById('summaryList');
      var summaryItems = currentLesson.summary || ["Review core lecture concepts carefully."];
      sumList.innerHTML = summaryItems.map(item => `<li>${item}</li>`).join('');

      var weakBtn = document.getElementById('reviewWeakBtn');
      if (missedIndexes.length > 0) weakBtn.classList.remove('hidden');
      else weakBtn.classList.add('hidden');

      getSupabaseClient().from('progress').upsert({
        lesson_id: currentLesson.id,
        best_score: score,
        total_questions: currentQuestions.length,
        current_question_index: currentQuestions.length
      });
    }

    function startWeakSpotReview() {
      currentQuestions = missedIndexes.map(i => currentLesson.questions[i]);
      currentIndex = 0; score = 0; missedIndexes = [];
      document.getElementById('summaryView').classList.add('hidden');
      document.getElementById('quizView').classList.remove('hidden');
      document.getElementById('quizControls').classList.remove('hidden');
      renderQuestion();
    }

    function toggleMode() {
      isFlashcardMode = !isFlashcardMode;
      document.getElementById('modeBtn').innerText = isFlashcardMode ? "Flip to Quiz 📝" : "Flip to Flashcards 🎴";
      document.getElementById('quizView').classList.toggle('hidden', isFlashcardMode);
      document.getElementById('flashcardView').classList.toggle('hidden', !isFlashcardMode);
      if (isFlashcardMode) stopTimer();
    }

    function deleteLesson(id) {
      if (confirm("Delete this lesson?")) {
        getSupabaseClient().from('lessons').delete().eq('id', id).then(loadLessons);
      }
    }

    function exitQuiz() {
      stopTimer();
      // Restore header on return
      document.getElementById('mainHeader').innerText = "Welcome back, Bazty James!";

      document.getElementById('quiz').classList.add('hidden');
      document.getElementById('setup').classList.remove('hidden');
      document.getElementById('quizView').classList.remove('hidden');
      document.getElementById('flashcardView').classList.add('hidden');
      loadLessons();
    }
  </script>
</body>
</html>
